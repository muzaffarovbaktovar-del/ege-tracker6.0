#nav button i{font-style:normal;font-size:20px}
#nav button.active{color:var(--accent)}

.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.score-card{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.score-card .label{font-size:13px;color:var(--muted)}

.stat.active{border-color:var(--accent)}
.stat .v{font-size:18px;font-weight:800}
.stat .l{font-size:10px;color:var(--muted);margin-top:2px}
.stat.know .v{color:var(--ok)}
.stat.learn .v{color:var(--warn)}
.stat.weak .v{color:var(--bad)}

.bar>span{display:block;height:100%}
.bar-info{font-size:11px;color:var(--muted);margin-top:6px}
.row{display:flex;gap:8px;margin-bottom:10px;align-items:center}

.task.know{border-color:var(--ok)}
.task.learn{border-color:var(--warn)}
.task.weak{border-color:var(--bad)}

.task .info{flex:1;min-width:0;cursor:pointer}
.task .title{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task .meta{font-size:11px;color:var(--muted);margin-top:2px}
.task .note-preview{font-size:11px;color:var(--purple);font-style:italic;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task .actions{display:flex;gap:2px;flex-shrink:0}

.task .actions button.active{opacity:1;background:var(--card2)}
.btn{background:var(--card2);border:0;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;color:var(--txt)}

.btn.danger{color:var(--bad)}
.btn.full{width:100%}
.btn-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}

.goal-card.reached{border-left-color:var(--ok)}
.goal-card.close{border-left-color:var(--warn)}
.goal-card.medium{border-left-color:var(--gold)}
.goal-card.far{border-left-color:var(--bad)}

.goal-card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}

.ach .name{font-size:12px;font-weight:700}

var LS_KEY="ege_pro_tracker_v2";

function blankData(){
  return{
    state:{math:{},rus:{},inf:{},bio:{},soc:{},hist:{},phys:{},mathb:{}},
    notes:{math:{},rus:{},inf:{},bio:{},soc:{},hist:{},phys:{},mathb:{}},
    studyLog:[],
    mocks:[],
    streak:{last:null,count:0},
    goals:{active:[]},
    onboarding:{done:false,subjects:["math","rus","inf"]}
  };
}

function loadData(){
  try{
    var raw=localStorage.getItem(LS_KEY);
    if(!raw)return blankData();
    var d=JSON.parse(raw);
    var base=blankData();
    if(d.state)base.state=Object.assign(base.state,d.state);
    if(d.notes)base.notes=Object.assign(base.notes,d.notes);
    if(Array.isArray(d.studyLog))base.studyLog=d.studyLog;
    if(Array.isArray(d.mocks)){
      // Миграция: старые записи не имеют id — присваиваем
      base.mocks=d.mocks.map(function(m,i){
        if(!m||typeof m!=="object")return m;
        if(!m.id)m.id="legacy_"+i+"_"+Math.random().toString(36).slice(2,8);
        return m;
      });
    }
    if(d.streak)base.streak=d.streak;
    if(d.goals)base.goals=d.goals;
    if(d.onboarding)base.onboarding=d.onboarding;
    return base;
  }catch(e){return blankData()}
}

}

// ===================== ЯДРО =====================
// Единый список активных предметов (то, что выбрано в онбординге).
// Если по какой-то причине пусто — берём все.
function activeSubjects(){
  var subs=(data.onboarding&&data.onboarding.subjects)||[];
  var filtered=subs.filter(function(k){return !!SUBJECTS[k]});
  if(!filtered.length)return Object.keys(SUBJECTS);
  return filtered;
}

function estPrimary(subj,state){
  var total=0;
  var tasks=SUBJECTS[subj].tasks;
  for(var n in state){
    var t=tasks[n];
    if(!t)continue;
    var pts=t[1];
    if(state[n]==="know")total+=pts;
    else if(state[n]==="learn")total+=pts/2;
  }
  return total;
}

function testScore(subj,state){
  var p=Math.round(estPrimary(subj,state));
  var max=SUBJECTS[subj].maxPrimary;
  p=Math.max(0,Math.min(p,max));
  return SUBJECTS[subj].scale[p];
}

function counts(state,tasks){
  var c={know:0,learn:0,weak:0,none:0};
  for(var n in tasks){
    var s=state[n];
    if(s==="know"||s==="learn"||s==="weak")c[s]++;
    else c.none++;
  }
  return c;
}

function daysUntilExam(){
  var today=new Date();
  var exam=new Date(today.getFullYear(),4,25);
  if(exam<=today)exam=new Date(today.getFullYear()+1,4,25);
  return Math.ceil((exam-today)/86400000);
}

function todayStr(){
  var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function registerStudyDay(){
  var today=todayStr();
  var st=data.streak;
  if(st.last===today)return;
  var y=new Date();y.setDate(y.getDate()-1);
  var yStr=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
  if(st.last===yStr)st.count=(st.count||0)+1;
  else st.count=1;
  st.last=today;
}

function totalStudySeconds(subject,sinceDate){
  var total=0;
  for(var i=0;i<data.studyLog.length;i++){
    var it=data.studyLog[i];
    if(subject&&it.subject!==subject)continue;
    if(sinceDate&&(it.date||"")<sinceDate)continue;
    total+=it.seconds||0;
  }
  return total;
}

function fmtDuration(sec){
  sec=Math.floor(sec);
  var h=Math.floor(sec/3600);
  var m=Math.floor((sec%3600)/60);
  if(h>0)return h+" ч "+m+" мин";
  return m+" мин";
}

function goalGap(scores,goal){
  var univ=UNIVERSITIES[goal.univ];
  if(!univ)return[0,0,0,"unknown"];
  var prog=null;
  for(var i=0;i<univ.programs.length;i++){
    if(univ.programs[i].code===goal.code){prog=univ.programs[i];break}
  }
  if(!prog)return[0,0,0,"unknown"];
  var current=0;
  for(var k in scores)current+=scores[k];
  var needed=prog[goal.type];
  if(needed<=0)return[current,needed,0,"unavailable"];
  var diff=needed-current;
  var status=diff<=0?"reached":diff<=20?"close":diff<=50?"medium":"far";
  return[current,needed,diff,status];
}

function goalRecommendations(scores,goal){
  var univ=UNIVERSITIES[goal.univ];
  if(!univ)return[];
  var prog=null;
  for(var i=0;i<univ.programs.length;i++){
    if(univ.programs[i].code===goal.code){prog=univ.programs[i];break}
  }
  if(!prog||prog[goal.type]<=0)return[];
  var total=0;
  for(var k in scores)total+=scores[k];
  var deficit=prog[goal.type]-total;
  if(deficit<=0)return[];
  var recs=[];
  var subs=activeSubjects();
  for(var si=0;si<subs.length;si++){
    var subjKey=subs[si];
    var meta=SUBJECTS[subjKey];
    var st=data.state[subjKey]||{};
    var cands=[];
    for(var n in meta.tasks){
      var s=st[n];
      if(s==="know")continue;
      var pts=meta.tasks[n][1];
      var gain=s==="learn"?pts/2:pts;
      cands.push({n:+n,topic:meta.tasks[n][0],pts:pts,gain:gain,status:s||"none"});
    }
    cands.sort(function(a,b){return b.gain-a.gain});
    var sum=0;
    for(var j=0;j<cands.length;j++){
      if(sum>=deficit)break;
      sum+=cands[j].gain;
      recs.push({subject:meta.name,subjKey:subjKey,n:cands[j].n,topic:cands[j].topic,pts:cands[j].pts,gain:cands[j].gain,status:cands[j].status});
    }
  }
  return recs;
}

function computeAchievements(){
  var A=[];
  var states=data.state;
  var subs=activeSubjects();
  var totalKnow=0;
  for(var i=0;i<subs.length;i++)totalKnow+=counts(states[subs[i]]||{},SUBJECTS[subs[i]].tasks).know;
  var anyMarked=false;
  for(var i2=0;i2<subs.length;i2++){
    if(Object.keys(states[subs[i2]]||{}).length>0){anyMarked=true;break}
  }
  var allKnowFull=false;
  for(var i3=0;i3<subs.length;i3++){
    var s=subs[i3];
    if(counts(states[s]||{},SUBJECTS[s].tasks).know===Object.keys(SUBJECTS[s].tasks).length){allKnowFull=true;break}
  }
  var scores={};
  for(var i4=0;i4<subs.length;i4++)scores[subs[i4]]=testScore(subs[i4],states[subs[i4]]||{});
  var totalTime=totalStudySeconds();
  var streak=data.streak.count||0;
  var any70=false,any80=false;
  for(var k in scores){if(scores[k]>=70)any70=true;if(scores[k]>=80)any80=true}
  A.push(["🎯","Первый шаг","Отметить хотя бы одну задачу",anyMarked]);
  A.push(["🔥","Разогрев","10 задач на «✅ Умею»",totalKnow>=10]);
  A.push(["🧠","Знаток","50 задач на «✅ Умею»",totalKnow>=50]);
  A.push(["📚","Всезнайка","Все задачи одного предмета",allKnowFull]);
  A.push(["💪","Марафонец","7 дней занятий подряд",streak>=7]);
  A.push(["⏱️","Трудяга","10 часов учёбы",totalTime>=36000]);
  A.push(["📈","Прорыв","70+ баллов в любом предмете",any70]);
  A.push(["🏆","Отличник","80+ баллов в любом предмете",any80]);
  var goalClose=false,goalReached=false;
  for(var g=0;g<data.goals.active.length;g++){
    var gp=goalGap(scores,data.goals.active[g]);
    if(gp[3]==="reached")goalReached=true;
    if(gp[2]<=20&&gp[3]!=="unavailable")goalClose=true;
  }
  A.push(["🎓","Цель рядом","До цели ≤ 20 баллов",goalClose||goalReached]);
  A.push(["✅","Цель достигнута","Прогноз дотянул до цели",goalReached]);
  return A;
}

function pickNextTask(){
  var cands=[];
  var subs=activeSubjects();
  for(var si=0;si<subs.length;si++){
    var subj=subs[si];
    var meta=SUBJECTS[subj];
    var st=data.state[subj]||{};
    for(var n in meta.tasks){
      var status=st[n]||"none";
      if(status==="know")continue;
      var prio=status==="weak"?0:status==="none"?1:2;
      cands.push({subj:subj,subjectName:meta.name,n:+n,topic:meta.tasks[n][0],pts:meta.tasks[n][1],status:status,score:prio*100-meta.tasks[n][1]*10});
    }
  }
  if(!cands.length)return null;
  cands.sort(function(a,b){return a.score-b.score});
  return cands[0];
}

function renderGoals(){
  var subs=activeSubjects();

  var mini=subs.map(function(k){
    var m=SUBJECTS[k];
    return '<div class="stat" style="pointer-events:none"><div class="v" style="color:'+statusColor(scores[k],m.pass)+'">'+scores[k]+'</div><div class="l">'+m.name+'</div></div>';
  }).join("");

  var goalsHtml="";
  for(var gi=0;gi<data.goals.active.length;gi++){
    var goal=data.goals.active[gi];
    var univ=UNIVERSITIES[goal.univ];
    if(!univ)continue;

    for(var pi=0;pi<univ.programs.length;pi++){if(univ.programs[pi].code===goal.code){prog=univ.programs[pi];break}}
    if(!prog)continue;
    var gap=goalGap(scores,goal);
    var cur=gap[0],needed=gap[1],diff=gap[2],status=gap[3];
    var statusText=status==="reached"?"✅ Ты проходишь!":status==="close"?"🔥 Осталось "+diff+" баллов":status==="medium"?"📈 Нужно ещё "+diff+" баллов":status==="far"?"❌ Не хватает "+diff+" баллов":"— таких мест нет";

      recsHtml='<div class="recs"><b style="color:var(--accent)">💡 Что подтянуть:</b>'+recs.map(function(r){return'<div>'+STATUS_META[r.status].sym+' '+esc(r.subject)+' №'+r.n+': '+esc(r.topic)+' (+'+r.gain.toFixed(1)+')</div>'}).join("")+'</div>';

    }
    var colorMap={reached:"var(--ok)",close:"var(--warn)",medium:"var(--gold)",far:"var(--bad)",unavailable:"var(--muted)"};
    var col=colorMap[status]||"var(--muted)";

  }

  var univOptions=Object.keys(UNIVERSITIES).map(function(u){return'<option value="'+esc(u)+'">'+esc(u)+'</option>'}).join("");

  return '<div class="card score-card"><div><div class="label">Сумма прогноза</div><div class="value" style="color:var(--gold)">'+total+' / '+maxTotal+'</div></div></div>'+

}

function renderMocks(){
  var subs=activeSubjects();

  var listHtml="";
  for(var si=0;si<subs.length;si++){

    if(!ms.length)continue;
    var W=320,H=80,PAD=8;

      var prim=Math.max(0,Math.min(m.primary,meta.maxPrimary));
      var test=meta.scale[prim];
      var x=PAD+(W-2*PAD)*(i/Math.max(ms.length-1,1));
      var y=H-PAD-(H-2*PAD)*(test/100);
      return{x:x,y:y,test:test,prim:prim};
    });
    var path=points.map(function(p,i){return(i?"L":"M")+p.x+" "+p.y}).join(" ");
    var passY=H-PAD-(H-2*PAD)*(meta.pass/100);
    var svg='<svg class="mock-chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><line x1="0" y1="'+passY+'" x2="'+W+'" y2="'+passY+'" stroke="var(--bad)" stroke-dasharray="3,3" stroke-width="1"/><text x="'+(W-4)+'" y="'+(passY-4)+'" fill="var(--bad)" font-size="9" text-anchor="end">порог '+meta.pass+'</text><path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2"/>'+points.map(function(p){return'<circle cx="'+p.x+'" cy="'+p.y+'" r="3" fill="var(--accent)"/>'}).join("")+'</svg>';
    var rowsHtml=ms.slice(-5).reverse().map(function(m){

    }).join("");
    listHtml+='<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><b>'+meta.name+'</b><span class="muted">'+ms.length+' записей</span></div>'+svg+rowsHtml+'</div>';
  }

  return '<h2>➕ Добавить пробник</h2>'+
    '<div class="card"><label>Дата</label><input type="date" data-action="mockDate" value="'+todayStr()+'"><label>Предмет</label><select data-action="mockSubject">'+subjOptions+'</select><label>Первичный балл</label><input type="number" data-action="mockPrimary" min="0" value="0" inputmode="numeric"><div class="muted" id="mockPreview" style="margin-top:6px">→ 0 тест. баллов</div><button class="btn primary full" style="margin-top:12px" data-action="addMock">Добавить</button></div>'+

}

    return'<div class="ob-tile '+(selected.indexOf(k)>=0?"sel":"")+'" data-action="obToggle" data-subj="'+k+'"><div class="ob-emoji">'+emoji+'</div><div class="ob-name">'+text+'</div></div>';
  }).join("");

  return'<div class="onboarding"><div class="ob-hero"><div class="ob-crown">🎓</div><h1>ЕГЭ 2026</h1><div class="ob-credit">Создано <b>ВЕЛИКИМ БАХТОВАРОМ</b> 🎩</div><div class="ob-sub">Выбери экзамены, которые ты сдаёшь</div></div><div class="ob-grid">'+tiles+'</div><button class="btn primary full ob-start" data-action="obStart"'+(selected.length?"":" disabled")+'>'+(selected.length?"Начать подготовку ("+selected.length+") →":"Выбери хотя бы один предмет")+'</button><div class="ob-hint">Можно изменить позже во вкладке «Сводка»</div></div>';
}

// ===================== RENDER =====================
function render(){
  var el=document.getElementById("view");
  var nav=document.getElementById("nav");
  var topbar=document.getElementById("topbar");

  if(!data.onboarding.done){
    nav.style.display="none";
    topbar.style.display="none";
    el.innerHTML=renderOnboarding();
    return;
  }
  nav.style.display="";
  topbar.style.display="";

  var btns=document.querySelectorAll("#nav button");
  for(var i=0;i<btns.length;i++){
    btns[i].classList.toggle("active",btns[i].dataset.view===ui.view);
  }

  if(ui.view==="tasks")el.innerHTML=renderTasks();
  else if(ui.view==="goals"){el.innerHTML=renderGoals();requestAnimationFrame(populatePrograms)}
  else if(ui.view==="mocks")el.innerHTML=renderMocks();
  else if(ui.view==="summary")el.innerHTML=renderSummary();
  updateHeader();
}

function populatePrograms(){
  var sel=document.querySelector('[data-action="progSelect"]');
  var univSel=document.querySelector('[data-action="univSelect"]');
  if(!sel||!univSel)return;
  var u=UNIVERSITIES[univSel.value];
  if(!u)return;
  sel.innerHTML=u.programs.map(function(p){return'<option value="'+p.code+'">'+esc(p.code)+' — '+esc(p.name)+'</option>'}).join("");
}

// ===================== ТАЙМЕР (глобальное состояние) =====================
var timer={running:false,remaining:25*60,mode:"focus",subject:"math",elapsed:0,id:null};
var TIMER_DUR={focus:25*60,short:5*60,long:15*60};

function timerUpdateDisplay(){
  var el=document.getElementById("timerTime");
  if(!el)return;
  var r=Math.max(0,timer.remaining);
  var m=Math.floor(r/60),s=r%60;
  el.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
function timerUpdateButton(){
  var b=document.getElementById("timerStart");
  if(!b)return;
  b.textContent=timer.running?"⏸ Пауза":(timer.elapsed>0?"▶ Продолжить":"▶ Старт");
}
function timerStart(){
  if(timer.running)return;
  timer.running=true;
  timerUpdateButton();
  var s=document.getElementById("timerStatus");
  if(s)s.textContent="Идёт сессия...";
  timer.id=setTimeout(timerTick,1000);
}
function timerPause(){
  if(!timer.running)return;
  timer.running=false;
  if(timer.id){clearTimeout(timer.id);timer.id=null}
  timerUpdateButton();
  var s=document.getElementById("timerStatus");
  if(s)s.textContent="Пауза";
}
function timerComplete(){
  var elapsed=timer.elapsed;
  var mode=timer.mode;
  var wasRunning=timer.running;
  timer.running=false;
  if(timer.id){clearTimeout(timer.id);timer.id=null}
  if(mode==="focus"&&elapsed>=60){
    data.studyLog.push({date:todayStr(),subject:timer.subject,seconds:elapsed,task:null});
    registerStudyDay();saveData();
    var s=document.getElementById("timerStatus");
    if(s)s.textContent="✅ Записано: "+fmtDuration(elapsed);
  }else{
    var s2=document.getElementById("timerStatus");
    if(s2)s2.textContent=wasRunning?"Сессия прервана":"";
  }
  timer.elapsed=0;
  timer.remaining=TIMER_DUR[timer.mode];
  timerUpdateDisplay();
  timerUpdateButton();
}
function timerTick(){
  if(!timer.running)return;
  timer.remaining--;
  timer.elapsed++;
  timerUpdateDisplay();
  if(timer.remaining<=0){timerComplete();return}
  timer.id=setTimeout(timerTick,1000);
}

// ===================== MODAL =====================
function openModal(html){
  document.getElementById("modalBox").innerHTML=html;
  document.getElementById("modal").classList.remove("hidden");
}
function closeModal(){
  // При закрытии модалки таймер должен быть поставлен на паузу,
  // иначе интервал продолжит крутиться в фоне и упрется в несуществующие элементы.
  timerPause();
  document.getElementById("modal").classList.add("hidden");
}

document.getElementById("modal").addEventListener("click",function(e){
  if(e.target.id==="modal"){closeModal();return}
  var el=e.target.closest("[data-action]");
  if(!el)return;
  var a=el.dataset.action;
  if(a==="closeModal")closeModal();
  else if(a==="saveNote"){
    var n=el.dataset.num;
    var v=document.getElementById("noteInput").value.trim();
    if(v)data.notes[ui.subject][n]=v;
    else delete data.notes[ui.subject][n];
    saveData();closeModal();render();
  }
});

// ===================== NAV =====================
document.getElementById("nav").addEventListener("click",function(e){
  var b=e.target.closest("button[data-view]");
  if(!b)return;
  ui.view=b.dataset.view;
  render();
});

// ===================== VIEW EVENTS =====================
document.getElementById("view").addEventListener("click",function(e){
  var el=e.target.closest("[data-action]");
  if(!el)return;
  var action=el.dataset.action;

  if(action==="obToggle"){
    var s=el.dataset.subj;
    var arr=data.onboarding.subjects;
    var i=arr.indexOf(s);
    if(i>=0)arr.splice(i,1);else arr.push(s);
    saveData();render();return;
  }
  if(action==="obStart"){
    if(!data.onboarding.subjects.length)return;
    data.onboarding.done=true;
    ui.subject=data.onboarding.subjects[0];
    saveData();render();return;
  }
  if(action==="editSubjects"){
    data.onboarding.done=false;
    saveData();render();return;
  }
  if(action==="setSubject"){
    ui.subject=el.dataset.subj;
    ui.filter="all";ui.query="";
    render();return;
  }
  if(action==="filter"){
    var f=el.dataset.f;
    ui.filter=ui.filter===f?"all":f;
    render();return;
  }
  if(action==="mark"){
    var n=el.dataset.num,st=el.dataset.st,subj=ui.subject;
    if(data.state[subj][n]===st)delete data.state[subj][n];
    else{data.state[subj][n]=st;registerStudyDay()}
    saveData();render();return;
  }
  if(action==="gotoTask"){
    ui.view="tasks";ui.subject=el.dataset.subj;ui.filter="all";ui.query="";
    render();return;
  }
  if(action==="addGoal"){
    var univSel=document.querySelector('[data-action="univSelect"]');
    var progSel=document.querySelector('[data-action="progSelect"]');
    var typeSel=document.querySelector('[data-action="typeSelect"]');
    var goal={univ:univSel.value,code:progSel.value,type:typeSel.value};
    var dup=false;
    for(var i=0;i<data.goals.active.length;i++){
      var g=data.goals.active[i];
      if(g.univ===goal.univ&&g.code===goal.code&&g.type===goal.type){dup=true;break}
    }
    if(dup){alert("Такая цель уже есть");return}
    data.goals.active.push(goal);saveData();render();return;
  }
  if(action==="removeGoal"){
    var u=el.dataset.univ,c=el.dataset.code,t=el.dataset.type;
    data.goals.active=data.goals.active.filter(function(g){return!(g.univ===u&&g.code===c&&g.type===t)});
    saveData();render();return;
  }
  if(action==="addMock"){
    var date=document.querySelector('[data-action="mockDate"]').value;
    var subj2=document.querySelector('[data-action="mockSubject"]').value;
    var prim=parseInt(document.querySelector('[data-action="mockPrimary"]').value,10);
    if(!date||!SUBJECTS[subj2]||isNaN(prim)||prim<0||prim>SUBJECTS[subj2].maxPrimary){alert("Проверь данные");return}
    data.mocks.push({
      id:"m_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),
      date:date,
      subject:subj2,
      primary:prim
    });
    registerStudyDay();saveData();render();return;
  }
  if(action==="delMock"){
    var id=el.dataset.id;
    if(!id)return;
    data.mocks=data.mocks.filter(function(m){return m.id!==id});
    saveData();render();return;
  }
  if(action==="plan"){
    var subj3=ui.subject,meta=SUBJECTS[subj3],st=data.state[subj3];
    var c=counts(st,meta.tasks);
    var lines=["📋 ПЛАН: "+meta.name,"Прогноз: ≈"+testScore(subj3,st)+"/100 (порог "+meta.pass+")",""];
    if(c.weak){
      lines.push("❌ Сначала с нуля:");
      Object.keys(meta.tasks).map(Number).sort(function(a,b){return a-b}).forEach(function(n){if(st[n]==="weak")lines.push("   "+n+". "+meta.tasks[n][0]+" ("+meta.tasks[n][1]+" б.)")});
      lines.push("");
    }
    if(c.learn){
      lines.push("📈 Затем закрепить:");
      Object.keys(meta.tasks).map(Number).sort(function(a,b){return a-b}).forEach(function(n){if(st[n]==="learn")lines.push("   "+n+". "+meta.tasks[n][0]+" ("+meta.tasks[n][1]+" б.)")});
      lines.push("");
    }
    if(!c.weak&&!c.learn)lines.push("Размечай задачи 📈 и ❌ — здесь появится план.\n");
    lines.push("💎 Самые жирные:");
    Object.keys(meta.tasks).map(Number).sort(function(a,b){return meta.tasks[b][1]-meta.tasks[a][1]}).slice(0,5).forEach(function(n){lines.push("   "+n+". "+meta.tasks[n][0]+" — "+meta.tasks[n][1]+" перв.")});
    openModal('<h3>📋 План: '+esc(meta.name)+'</h3><pre style="white-space:pre-wrap;font-family:inherit;font-size:13px;margin:0">'+esc(lines.join("\n"))+'</pre><div class="modal-actions"><button class="btn" data-action="closeModal">Закрыть</button></div>');
    return;
  }
  if(action==="export"){
    var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    var a2=document.createElement("a");
    a2.href=URL.createObjectURL(blob);
    a2.download="ege_tracker_"+todayStr()+".json";
    a2.click();return;
  }
  if(action==="import"){
    var input=document.createElement("input");
    input.type="file";input.accept=".json,application/json";
    input.onchange=function(){
      var f=input.files[0];if(!f)return;
      var r=new FileReader();
      r.onload=function(){
        try{
          var parsed=JSON.parse(r.result);
          if(confirm("Заменить текущий прогресс импортированным?")){
            var base=blankData();
            if(parsed.state)base.state=Object.assign(base.state,parsed.state);
            if(parsed.notes)base.notes=Object.assign(base.notes,parsed.notes);
            if(parsed.studyLog)base.studyLog=parsed.studyLog;
            if(Array.isArray(parsed.mocks)){
              base.mocks=parsed.mocks.map(function(m,i){
                if(!m||typeof m!=="object")return m;
                if(!m.id)m.id="legacy_"+i+"_"+Math.random().toString(36).slice(2,8);
                return m;
              });
            }
            if(parsed.streak)base.streak=parsed.streak;
            if(parsed.goals)base.goals=parsed.goals;
            if(parsed.onboarding)base.onboarding=parsed.onboarding;
            data=base;saveData();render();
          }
        }catch(err){alert("Ошибка файла: "+err.message)}
      };
      r.readAsText(f);
    };
    input.click();return;
  }
  if(action==="reset"){
    if(confirm('Сбросить прогресс по «'+SUBJECTS[ui.subject].name+'»?')){
      data.state[ui.subject]={};
      data.notes[ui.subject]={};
      saveData();render();
    }
    return;
  }
  if(action==="editNote"){
    var nn=el.dataset.num,subj4=ui.subject;
    var cur=data.notes[subj4][nn]||"";
    openModal('<h3>📝 Заметка к №'+nn+'</h3><div class="muted" style="margin-bottom:8px">'+esc(SUBJECTS[subj4].tasks[nn][0])+'</div><textarea id="noteInput" placeholder="Что запомнить...">'+esc(cur)+'</textarea><div class="modal-actions"><button class="btn" data-action="closeModal">Отмена</button><button class="btn primary" data-action="saveNote" data-num="'+nn+'">Сохранить</button></div>');
    setTimeout(function(){var inp=document.getElementById("noteInput");if(inp)inp.focus()},50);
    return;
  }
});

// Единый change-хэндлер (раньше их было два)
document.getElementById("view").addEventListener("change",function(e){
  var el=e.target.closest("[data-action]");
  if(!el)return;
  var a=el.dataset.action;
  if(a==="sort"){ui.sort=el.value;render();return}
  if(a==="univSelect"){populatePrograms();return}
  if(a==="mockSubject"){
    var subj=el.value,meta=SUBJECTS[subj];
    var prev=document.getElementById("mockPreview");
    if(prev){
      var p=parseInt(document.querySelector('[data-action="mockPrimary"]').value)||0;
      p=Math.max(0,Math.min(p,meta.maxPrimary));
      prev.textContent="→ "+meta.scale[p]+" тест. баллов";
    }
    return;
  }
});

document.getElementById("view").addEventListener("input",function(e){
  var el=e.target.closest('[data-action="search"]');
  if(el){
    ui.query=el.value.trim().toLowerCase();
    var list=document.getElementById("taskList");
    if(list){
      var subj=ui.subject,meta=SUBJECTS[subj],st=data.state[subj]||{};
      var rows=[];
      Object.keys(meta.tasks).map(Number).sort(function(a,b){return a-b}).forEach(function(n){
        var s=st[n]||"none";
        if(ui.filter!=="all"&&s!==ui.filter)return;
        var topic=meta.tasks[n][0],pts=meta.tasks[n][1];
        if(ui.query&&topic.toLowerCase().indexOf(ui.query)<0)return;
        var note=(data.notes[subj]||{})[n]||"";
        var scale=meta.scale[Math.min(pts,meta.maxPrimary)];
        rows.push('<div class="task '+s+'" data-num="'+n+'"><div class="num">'+n+'</div><div class="info" data-action="editNote" data-num="'+n+'"><div class="title">'+esc(topic)+(note?" 📝":"")+'</div><div class="meta">'+pts+' перв. · ≈'+scale+' тест.</div></div><div class="actions">'+["know","learn","weak"].map(function(x){return'<button data-action="mark" data-num="'+n+'" data-st="'+x+'" class="'+(s===x?"active":"")+'">'+STATUS_META[x].sym+'</button>'}).join("")+'</div></div>');
      });
      list.innerHTML=rows.join("")||'<div class="center">Ничего не найдено</div>';
    }
    return;
  }
  var mP=e.target.closest('[data-action="mockPrimary"]');
  if(mP){
    var subj2=document.querySelector('[data-action="mockSubject"]').value;
    var meta2=SUBJECTS[subj2];
    var p=Math.max(0,Math.min(parseInt(mP.value)||0,meta2.maxPrimary));
    var prev=document.getElementById("mockPreview");
    if(prev)prev.textContent="→ "+meta2.scale[p]+" тест. баллов";
  }
});

// ===================== ТАЙМЕР: КНОПКА =====================
document.getElementById("timerBtn").addEventListener("click",function(){
  var subjOpts=activeSubjects().map(function(k){
    return '<option value="'+k+'"'+(k===timer.subject?" selected":"")+'>'+SUBJECTS[k].name+'</option>';
  }).join("");
  var btnLabel=timer.running?"⏸ Пауза":(timer.elapsed>0?"▶ Продолжить":"▶ Старт");
  var statusText=timer.running?"Идёт сессия...":(timer.elapsed>0?"Пауза":"");
  var mins=Math.floor(timer.remaining/60);
  var secs=timer.remaining%60;
  var mFocus=timer.mode==="focus"?"active":"";
  var mShort=timer.mode==="short"?"active":"";
  var mLong=timer.mode==="long"?"active":"";
  openModal(
    '<h3 style="text-align:center">⏱ Помодоро</h3>'+
    '<select id="timerSubject" style="margin-bottom:10px">'+subjOpts+'</select>'+
    '<div class="timer-time" id="timerTime">'+String(mins).padStart(2,"0")+":"+String(secs).padStart(2,"0")+'</div>'+
    '<div class="timer-modes">'+
      '<button data-action="tmode" data-m="focus" class="'+mFocus+'">🎯 25</button>'+
      '<button data-action="tmode" data-m="short" class="'+mShort+'">☕ 5</button>'+
      '<button data-action="tmode" data-m="long" class="'+mLong+'">🌴 15</button>'+
    '</div>'+
    '<div class="timer-actions">'+
      '<button class="btn primary" id="timerStart">'+btnLabel+'</button>'+
      '<button class="btn" id="timerStop">■ Стоп</button>'+
    '</div>'+
    '<div class="timer-status" id="timerStatus">'+statusText+'</div>'+
    '<div class="modal-actions" style="margin-top:10px"><button class="btn" data-action="closeModal">Закрыть</button></div>'
  );

  var startBtn=document.getElementById("timerStart");
  var stopBtn=document.getElementById("timerStop");
  if(startBtn)startBtn.onclick=function(){timer.running?timerPause():timerStart()};
  if(stopBtn)stopBtn.onclick=function(){timerComplete()};

  var modeBtns=document.querySelectorAll('[data-action="tmode"]');
  for(var i=0;i<modeBtns.length;i++){
    modeBtns[i].onclick=function(){
      if(timer.running)return;
      timer.mode=this.dataset.m;
      timer.remaining=TIMER_DUR[timer.mode];
      timer.elapsed=0;
      timerUpdateDisplay();
      timerUpdateButton();
      var all=document.querySelectorAll('[data-action="tmode"]');
      for(var j=0;j<all.length;j++)all[j].classList.remove("active");
      this.classList.add("active");
      var s=document.getElementById("timerStatus");
      if(s)s.textContent="";
    };
  }

  var subjSel=document.getElementById("timerSubject");
  if(subjSel)subjSel.onchange=function(){timer.subject=this.value};
});

// ===================== СТАРТ =====================
render();
</script>
