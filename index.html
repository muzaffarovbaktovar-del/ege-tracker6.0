:root {

html, body { margin:0; padding:0; height:100%; overscroll-behavior:none; }
body {

button { font-family: inherit; color: inherit; cursor: pointer; }
#topbar {

  background: rgba(15,17,23,0.92); backdrop-filter: blur(10px);

.brand { font-weight: 700; font-size: 15px; }
.top-right { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; }
#streak { color: var(--gold); }
#days { color: var(--warn); }
.icon-btn { background: var(--card2); border: 0; border-radius: 8px; padding: 6px 10px; font-size: 15px; }
#nav {

#nav button {

#nav button i { font-style: normal; font-size: 20px; }
#nav button.active { color: var(--accent); }
#view { padding: 12px 12px 24px; max-width: 640px; margin: 0 auto; }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; }

.score-card .label { font-size: 13px; color: var(--muted); }

.stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; margin-bottom: 10px; }
.stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 4px; text-align: center; cursor: pointer; transition: border-color .15s; }
.stat.active { border-color: var(--accent); }
.stat .v { font-size: 18px; font-weight: 800; }
.stat .l { font-size: 10px; color: var(--muted); margin-top: 2px; }
.stat.know .v { color: var(--ok); } .stat.learn .v { color: var(--warn); }
.stat.weak .v { color: var(--bad); } .stat.none .v { color: var(--muted); }
.bar-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
.bar { height: 12px; border-radius: 6px; overflow: hidden; display: flex; background: #141824; }
.bar > span { display: block; height: 100%; }
.bar-info { font-size: 11px; color: var(--muted); margin-top: 6px; }

.ob-sub {
  font-size: 14px;
  color: var(--muted);
  margin-top: 18px;
}
.ob-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 22px;
}
.ob-tile {
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: 14px;
  padding: 16px 10px;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
  user-select: none;
  -webkit-user-select: none;
}
.ob-tile:active { transform: scale(0.96); }
.ob-tile.sel {
  border-color: var(--accent);
  background: rgba(108,140,255,0.10);
  box-shadow: 0 0 0 1px var(--accent), 0 4px 18px rgba(108,140,255,0.25);

  font-size: 13px; font-weight: 700;

.ob-start {
  font-size: 15px;
  padding: 14px;
  margin-top: 6px;

.ob-start:disabled {
  opacity: 0.4;
  cursor: not-allowed;

.ob-hint {
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  margin-top: 14px;
}
.muted { color: var(--muted); font-size: 12px; }
.center { text-align: center; padding: 20px 0; color: var(--muted); }
h2 { font-size: 15px; margin: 14px 0 8px; }
h2:first-child { margin-top: 4px; }

const LS_KEY = "ege_pro_tracker_v1";
function blankData() {
  return {
    state:   { math:{}, rus:{}, inf:{}, bio:{}, soc:{}, hist:{}, phys:{}, mathb:{} },
    notes:   { math:{}, rus:{}, inf:{}, bio:{}, soc:{}, hist:{}, phys:{}, mathb:{} },
    studyLog:[],
    mocks:   [],
    streak:  { last:null, count:0 },
    goals:   { active:[] },
    onboarding: { done: false, subjects: ["math","rus","inf"] },
  };
}
function loadData() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return blankData();
    const d = JSON.parse(raw);
    const base = blankData();
    base.state   = { ...base.state,   ...(d.state   || {}) };
    base.notes   = { ...base.notes,   ...(d.notes   || {}) };
    base.studyLog= Array.isArray(d.studyLog) ? d.studyLog : [];
    base.mocks   = Array.isArray(d.mocks)    ? d.mocks    : [];
    base.streak  = d.streak || { last:null, count:0 };
    base.goals   = d.goals  || { active:[] };
    base.onboarding = d.onboarding || { done:false, subjects:["math","rus","inf"] };
    return base;
  } catch (e) { return blankData(); }
}

function estPrimary(subj, state) {
  let total = 0;
  const tasks = SUBJECTS[subj].tasks;
  for (const [n, st] of Object.entries(state || {})) {
    const t = tasks[n];
    if (!t) continue;
    const pts = t[1];
    if (st === "know")  total += pts;
    else if (st === "learn") total += pts / 2;
  }
  return total;
}
function testScore(subj, state) {
  let p = Math.round(estPrimary(subj, state));
  const max = SUBJECTS[subj].maxPrimary;
  p = Math.max(0, Math.min(p, max));
  return SUBJECTS[subj].scale[p];
}
function counts(state, tasks) {
  const c = { know:0, learn:0, weak:0, none:0 };
  for (const n of Object.keys(tasks)) {
    const s = (state || {})[n];
    if (s === "know" || s === "learn" || s === "weak") c[s]++;
    else c.none++;
  }
  return c;
}
function daysUntilExam() {
  const today = new Date();
  let exam = new Date(today.getFullYear(), 4, 25);
  if (exam <= today) exam = new Date(today.getFullYear() + 1, 4, 25);
  return Math.ceil((exam - today) / 86400000);
}
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function registerStudyDay() {
  const today = todayStr();
  const st = data.streak;
  if (st.last === today) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  const yStr = `${y.getFullYear()}-${String(y.getMonth()+1).padStart(2,"0")}-${String(y.getDate()).padStart(2,"0")}`;
  if (st.last === yStr) st.count = (st.count || 0) + 1;
  else st.count = 1;
  st.last = today;
}
function totalStudySeconds(subject, sinceDate) {
  let total = 0;
  for (const it of data.studyLog) {
    if (subject && it.subject !== subject) continue;
    if (sinceDate && (it.date || "") < sinceDate) continue;
    total += it.seconds || 0;
  }
  return total;
}
function fmtDuration(sec) {
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  if (h > 0) return `${h} ч ${m} мин`;
  return `${m} мин`;
}
function goalGap(scores, goal) {
  const univ = UNIVERSITIES[goal.univ];
  if (!univ) return [0,0,0,"unknown"];
  const prog = univ.programs.find(p => p.code === goal.code);
  if (!prog) return [0,0,0,"unknown"];
  const current = Object.values(scores).reduce((a,b)=>a+b, 0);
  const needed = prog[goal.type];
  if (needed <= 0) return [current, needed, 0, "unavailable"];
  const diff = needed - current;
  const status = diff <= 0 ? "reached" : diff <= 20 ? "close" : diff <= 50 ? "medium" : "far";
  return [current, needed, diff, status];
}
function goalRecommendations(scores, goal) {
  const univ = UNIVERSITIES[goal.univ];
  if (!univ) return [];
  const prog = univ.programs.find(p => p.code === goal.code);
  if (!prog || prog[goal.type] <= 0) return [];
  const deficit = prog[goal.type] - Object.values(scores).reduce((a,b)=>a+b, 0);
  if (deficit <= 0) return [];
  const recs = [];
  for (const [subjKey, meta] of Object.entries(SUBJECTS)) {
    const st = data.state[subjKey] || {};
    const cands = [];
    for (const [n, [topic, pts]] of Object.entries(meta.tasks)) {
      const s = st[n];
      if (s === "know") continue;
      const gain = s === "learn" ? pts / 2 : pts;
      cands.push({ n:+n, topic, pts, gain, status: s || "none" });
    }
    cands.sort((a,b) => b.gain - a.gain);
    let total = 0;
    for (const c of cands) {
      if (total >= deficit) break;
      total += c.gain;
      recs.push({ subject: meta.name, subjKey, ...c });
    }
  }
  return recs;
}
function computeAchievements() {
  const A = [];
  const states = data.state;
  let totalKnow = 0;
  for (const k of Object.keys(SUBJECTS)) totalKnow += counts(states[k], SUBJECTS[k].tasks).know;
  const anyMarked = Object.values(states).some(s => Object.keys(s).length > 0);
  const allKnowFull = Object.keys(SUBJECTS).some(k =>
    counts(states[k], SUBJECTS[k].tasks).know === Object.keys(SUBJECTS[k].tasks).length);
  const scores = {};
  for (const k of Object.keys(SUBJECTS)) scores[k] = testScore(k, states[k]);
  const totalTime = totalStudySeconds();
  const streak = data.streak.count || 0;
  A.push(["🎯", "Первый шаг",    "Отметить хотя бы одну задачу", anyMarked]);
  A.push(["🔥", "Разогрев",      "10 задач на «✅ Умею»",         totalKnow >= 10]);
  A.push(["🧠", "Знаток",        "50 задач на «✅ Умею»",         totalKnow >= 50]);
  A.push(["📚", "Всезнайка",     "Все задачи одного предмета",    allKnowFull]);
  A.push(["💪", "Марафонец",     "7 дней занятий подряд",         streak >= 7]);
  A.push(["⏱️", "Трудяга",       "10 часов учёбы",                totalTime >= 10*3600]);
  A.push(["📈", "Прорыв",        "70+ баллов в любом предмете",   Object.values(scores).some(s => s >= 70)]);
  A.push(["🏆", "Отличник",      "80+ баллов в любом предмете",   Object.values(scores).some(s => s >= 80)]);
  let goalClose = false, goalReached = false;
  for (const g of data.goals.active) {
    const [, , diff, status] = goalGap(scores, g);
    if (status === "reached") goalReached = true;
    if (diff <= 20 && status !== "unavailable") goalClose = true;
  }
  A.push(["🎓", "Цель рядом",       "До цели ≤ 20 баллов",     goalClose || goalReached]);
  A.push(["✅", "Цель достигнута",  "Прогноз дотянул до цели", goalReached]);
  return A;
}
function pickNextTask() {
  const cands = [];
  for (const [subj, meta] of Object.entries(SUBJECTS)) {
    const st = data.state[subj] || {};
    for (const [n, [topic, pts]] of Object.entries(meta.tasks)) {
      const status = st[n] || "none";
      if (status === "know") continue;
      const prio = { weak:0, none:1, learn:2 }[status];
      cands.push({ subj, subjectName: meta.name, n:+n, topic, pts, status, score: prio*100 - pts*10 });
    }
  }
  if (!cands.length) return null;
  cands.sort((a,b) => a.score - b.score);
  return cands[0];
}

function renderGoals() {
  const scores = {};
  for (const k of Object.keys(SUBJECTS)) scores[k] = testScore(k, data.state[k]);
  const total = Object.values(scores).reduce((a,b)=>a+b,0);
  const mini = Object.entries(SUBJECTS).map(([k, m]) =>
    `<div class="stat" style="pointer-events:none">
       <div class="v" style="color:${statusColor(scores[k], m.pass)}">${scores[k]}</div>
       <div class="l">${m.name}</div>
     </div>`).join("");

  const active = data.goals.active;
  let goalsHtml = "";
  for (const goal of active) {
    const univ = UNIVERSITIES[goal.univ];
    if (!univ) continue;
    const prog = univ.programs.find(p => p.code === goal.code);
    if (!prog) continue;
    const [cur, needed, diff, status] = goalGap(scores, goal);
    const statusText = {
      reached: "✅ Ты проходишь!",
      close:   `🔥 Осталось ${diff} баллов`,

    }[status] || "?";
    const typeLabel = goal.type === "budget" ? "🎓 Бюджет" : "💰 Платное";
    const frac = needed > 0 ? Math.min(cur/needed, 1) * 100 : 0;
    const recs = goalRecommendations(scores, goal).slice(0, 6);
    const recsHtml = recs.length
      ? `<div class="recs"><b style="color:var(--accent)">💡 Что подтянуть:</b>${
          recs.map(r => `<div>${STATUS_META[r.status].sym} ${esc(r.subject)} №${r.n}: ${esc(r.topic)} (+${r.gain.toFixed(1)})</div>`).join("")
        }</div>`
      : (status !== "reached" && status !== "unavailable"
          ? `<div class="recs" style="color:var(--ok)">Все доступные задачи уже «✅» — красава!</div>` : "");
    const colorMap = { reached:"var(--ok)", close:"var(--warn)", medium:"var(--gold)", far:"var(--bad)", unavailable:"var(--muted)" };
    goalsHtml += `
      <div class="goal-card ${status}">
        <div class="top">
          <div>
            <div class="name">${esc(goal.univ)} · ${esc(prog.code)}</div>
            <div class="prog">${esc(prog.name)}</div>
          </div>
          <span style="font-size:11px;color:var(--muted);flex-shrink:0">${typeLabel}</span>
        </div>
        <div class="status" style="color:${colorMap[status]}">Прогноз: ${cur} / ${needed} · ${statusText}</div>
        <div class="bar" style="color:${colorMap[status]}"><span style="width:${frac}%;background:${colorMap[status]}"></span></div>
        ${prog.cost ? `<div class="prog" style="margin-top:6px">💰 ${prog.cost.toLocaleString("ru")} ₽/год</div>` : ""}
        ${recsHtml}
        <div style="text-align:right;margin-top:8px">
          <button class="btn danger" style="padding:6px 10px;font-size:11px"
                  data-action="removeGoal" data-univ="${esc(goal.univ)}" data-code="${goal.code}" data-type="${goal.type}">🗑 Убрать</button>
        </div>
      </div>`;
  }
  const univOptions = Object.keys(UNIVERSITIES).map(u => `<option value="${esc(u)}">${esc(u)}</option>`).join("");
  return `
    <div class="card score-card">
      <div>
        <div class="label">Сумма прогноза</div>
        <div class="value" style="color:var(--gold)">${total} / 300</div>
      </div>
    </div>

function renderMocks() {
  const subjOptions = Object.entries(SUBJECTS).map(([k, m]) =>
    `<option value="${k}">${m.name}</option>`).join("");
  let listHtml = "";
  for (const [subjK, meta] of Object.entries(SUBJECTS)) {
    const ms = data.mocks.filter(m => m.subject === subjK).sort((a,b) => (a.date||"").localeCompare(b.date||""));
    if (!ms.length) continue;
    const W = 320, H = 80, PAD = 8;
    let points = ms.map((m, i) => {
      const prim = Math.max(0, Math.min(m.primary, meta.maxPrimary));
      const test = meta.scale[prim];
      const x = PAD + (W - 2*PAD) * (i / Math.max(ms.length - 1, 1));
      const y = H - PAD - (H - 2*PAD) * (test / 100);
      return { x, y, test, prim, date: m.date };
    });
    let path = points.map((p, i) => (i ? "L" : "M") + p.x + " " + p.y).join(" ");
    const passY = H - PAD - (H - 2*PAD) * (meta.pass / 100);
    const svg = `
      <svg class="mock-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <line x1="0" y1="${passY}" x2="${W}" y2="${passY}" stroke="var(--bad)" stroke-dasharray="3,3" stroke-width="1"/>
        <text x="${W-4}" y="${passY-4}" fill="var(--bad)" font-size="9" text-anchor="end">порог ${meta.pass}</text>
        <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>
        ${points.map(p => `<circle cx="${p.x}" cy="${p.y}" r="3" fill="var(--accent)"/>`).join("")}
      </svg>`;
    const rows = ms.slice(-5).reverse().map(m => {
      const i = ms.indexOf(m);
      const prim = Math.max(0, Math.min(m.primary, meta.maxPrimary));
      const test = meta.scale[prim];
      const col = test >= meta.pass ? "var(--ok)" : (test >= meta.pass*0.6 ? "var(--warn)" : "var(--bad)");
      return `<div class="mock-row">
        <span>${esc(m.date || "—")}</span>
        <span style="color:${col}">перв. ${prim} → тест. ${test}</span>
        <button data-action="delMock" data-idx="${i}" style="background:none;border:0;color:var(--bad);font-size:14px">✕</button>
      </div>`;
    }).join("");
    listHtml += `
      <div class="card">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px">
          <b>${meta.name}</b>
          <span class="muted">${ms.length} записей</span>
        </div>
        ${svg}
        ${rows}
      </div>`;
  }
  return `
    <h2>➕ Добавить пробник</h2>
    <div class="card">
      <label>Дата</label>
      <input type="date" data-action="mockDate" value="${todayStr()}">
      <label>Предмет</label>
      <select data-action="mockSubject">${subjOptions}</select>
      <label>Первичный балл</label>
      <input type="number" data-action="mockPrimary" min="0" value="0" inputmode="numeric">
      <div class="muted" id="mockPreview" style="margin-top:6px">→ 0 тест. баллов</div>
      <button class="btn primary full" style="margin-top:12px" data-action="addMock">Добавить</button>
    </div>
    ${listHtml || '<div class="center">Пока нет записей</div>'}
  `;
}

  nav.style.display = "";
  topbar.style.display = "";

  document.querySelectorAll("#nav button").forEach(b => {
    b.classList.toggle("active", b.dataset.view === ui.view);
  });
  if (ui.view === "tasks") el.innerHTML = renderTasks();
  else if (ui.view === "goals") { el.innerHTML = renderGoals(); requestAnimationFrame(populatePrograms); }
  else if (ui.view === "mocks") el.innerHTML = renderMocks();
  else if (ui.view === "summary") el.innerHTML = renderSummary();
  updateHeader();
}
// ===================== ONBOARDING =====================
function renderOnboarding() {
  const allSubj = Object.entries(SUBJECTS);
  const selected = data.onboarding.subjects || [];
  const tiles = allSubj.map(([k, m]) => {
    const parts = m.name.split(" ");
    const emoji = parts[0];
    const text = parts.slice(1).join(" ");
    return `
      <div class="ob-tile ${selected.includes(k)?"sel":""}" data-action="obToggle" data-subj="${k}">
        <div class="ob-emoji">${emoji}</div>
        <div class="ob-name">${text}</div>
      </div>`;
  }).join("");

  return `
    <div class="onboarding">
      <div class="ob-hero">
        <div class="ob-crown">🎓</div>
        <h1>ЕГЭ 2026</h1>
        <div class="ob-credit">Создано <b>ВЕЛИКИМ БАХТОВАРОМ</b> 🎩</div>
        <div class="ob-sub">Выбери экзамены, которые ты сдаёшь</div>
      </div>
      <div class="ob-grid">${tiles}</div>
      <button class="btn primary full ob-start" data-action="obStart" ${selected.length ? "" : "disabled"}>
        ${selected.length ? `Начать подготовку (${selected.length}) →` : "Выбери хотя бы один предмет"}
      </button>
      <div class="ob-hint">Можно изменить позже во вкладке «Сводка»</div>
    </div>
  `;
}
// ===================== MODAL =====================
function openModal(html) {
  document.getElementById("modalBox").innerHTML = html;
  document.getElementById("modal").classList.remove("hidden");
}
function closeModal() {
  document.getElementById("modal").classList.add("hidden");
}
document.getElementById("modal").addEventListener("click", e => {
  if (e.target.id === "modal") closeModal();
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  if (a === "closeModal") closeModal();
  else if (a === "saveNote") {
    const n = el.dataset.num;
    const v = document.getElementById("noteInput").value.trim();
    if (v) data.notes[ui.subject][n] = v;
    else delete data.notes[ui.subject][n];
    saveData(); closeModal(); render();
  }
});

// ===================== NAV =====================
document.getElementById("nav").addEventListener("click", e => {
  const b = e.target.closest("button[data-view]");
  if (!b) return;
  ui.view = b.dataset.view;
  render();
});

// ===================== VIEW EVENTS =====================
document.getElementById("view").addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
if (action === "obToggle") {
  const s = el.dataset.subj;
  const arr = data.onboarding.subjects;
  const i = arr.indexOf(s);
  if (i >= 0) arr.splice(i, 1);
  else arr.push(s);
  saveData();
  render();
  return;
}
if (action === "obStart") {
  if (!data.onboarding.subjects.length) return;
  data.onboarding.done = true;
  ui.subject = data.onboarding.subjects[0];
  saveData();
  render();
  return;
}
if (action === "editSubjects") {
  data.onboarding.done = false;
  saveData();
  render();
  return;
}
  if (action === "setSubject") {
    ui.subject = el.dataset.subj;
    ui.filter = "all";
    ui.query = "";
    render();
  }
  else if (action === "filter") {
    const f = el.dataset.f;
    ui.filter = ui.filter === f ? "all" : f;
    render();
  }
  else if (action === "mark") {
    const n = el.dataset.num, st = el.dataset.st;
    const subj = ui.subject;
    if (data.state[subj][n] === st) delete data.state[subj][n];
    else { data.state[subj][n] = st; registerStudyDay(); }
    saveData();
    render();
  }
  else if (action === "gotoTask") {
    ui.view = "tasks";
    ui.subject = el.dataset.subj;
    ui.filter = "all"; ui.query = "";
    render();
  }
  else if (action === "addGoal") {
    const univSel = document.querySelector('[data-action="univSelect"]');
    const progSel = document.querySelector('[data-action="progSelect"]');
    const typeSel = document.querySelector('[data-action="typeSelect"]');
    const goal = { univ: univSel.value, code: progSel.value, type: typeSel.value };
    if (data.goals.active.some(g => g.univ===goal.univ && g.code===goal.code && g.type===goal.type)) {
      alert("Такая цель уже есть"); return;
    }
    data.goals.active.push(goal);
    saveData(); render();
  }
  else if (action === "removeGoal") {
    const { univ, code, type } = el.dataset;
    data.goals.active = data.goals.active.filter(g => !(g.univ===univ && g.code===code && g.type===type));
    saveData(); render();
  }
  else if (action === "addMock") {
    const date = document.querySelector('[data-action="mockDate"]').value;
    const subj = document.querySelector('[data-action="mockSubject"]').value;
    const prim = parseInt(document.querySelector('[data-action="mockPrimary"]').value, 10);
    if (!date || !SUBJECTS[subj] || isNaN(prim) || prim < 0 || prim > SUBJECTS[subj].maxPrimary) {
      alert("Проверь данные"); return;
    }
    data.mocks.push({ date, subject: subj, primary: prim });
    registerStudyDay(); saveData(); render();
  }
  else if (action === "delMock") {
    const i = parseInt(el.dataset.idx, 10);
    if (!isNaN(i)) { data.mocks.splice(i, 1); saveData(); render(); }
  }
  else if (action === "plan") {
    const subj = ui.subject;
    const meta = SUBJECTS[subj];
    const st = data.state[subj];
    const c = counts(st, meta.tasks);
    const lines = [`📋 ПЛАН: ${meta.name}`, `Прогноз: ≈${testScore(subj, st)}/100 (порог ${meta.pass})`, ""];
    if (c.weak) {
      lines.push("❌ Сначала с нуля:");
      for (const n of Object.keys(meta.tasks).map(Number).sort((a,b)=>a-b))
        if (st[n] === "weak") lines.push(`   ${n}. ${meta.tasks[n][0]} (${meta.tasks[n][1]} б.)`);
      lines.push("");
    }
    if (c.learn) {
      lines.push("📈 Затем закрепить:");
      for (const n of Object.keys(meta.tasks).map(Number).sort((a,b)=>a-b))
        if (st[n] === "learn") lines.push(`   ${n}. ${meta.tasks[n][0]} (${meta.tasks[n][1]} б.)`);
      lines.push("");
    }
    if (!c.weak && !c.learn) lines.push("Размечай задачи 📈 и ❌ — здесь появится план.\n");
    lines.push("💎 Самые жирные:");
    for (const n of Object.keys(meta.tasks).map(Number).sort((a,b)=>meta.tasks[b][1]-meta.tasks[a][1]).slice(0,5))
      lines.push(`   ${n}. ${meta.tasks[n][0]} — ${meta.tasks[n][1]} перв.`);
    openModal(`<h3>📋 План: ${esc(meta.name)}</h3>
      <pre style="white-space:pre-wrap;font-family:inherit;font-size:13px;margin:0">${esc(lines.join("\n"))}</pre>
      <div class="modal-actions"><button class="btn" data-action="closeModal">Закрыть</button></div>`);
  }
  else if (action === "export") {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:"application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `ege_tracker_${todayStr()}.json`;
    a.click();
  }
  else if (action === "import") {
    const input = document.createElement("input");
    input.type = "file"; input.accept = ".json,application/json";
    input.onchange = () => {
      const f = input.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const parsed = JSON.parse(r.result);
          if (confirm("Заменить текущий прогресс импортированным?")) {
            const base = blankData();
            base.state = { ...base.state, ...(parsed.state||{}) };
            base.notes = { ...base.notes, ...(parsed.notes||{}) };
            base.studyLog = parsed.studyLog || [];
            base.mocks    = parsed.mocks    || [];
            base.streak   = parsed.streak   || base.streak;
            base.goals    = parsed.goals    || base.goals;
            data = base; saveData(); render();
          }
        } catch (err) { alert("Ошибка файла: " + err.message); }
      };
      r.readAsText(f);
    };
    input.click();
  }
  else if (action === "reset") {
    if (confirm(`Сбросить прогресс по «${SUBJECTS[ui.subject].name}»?`)) {
      data.state[ui.subject] = {};
      data.notes[ui.subject] = {};
      saveData(); render();
    }
  }
  else if (action === "editNote") {
    const n = el.dataset.num;
    const subj = ui.subject;
    const cur = data.notes[subj][n] || "";
    openModal(`
      <h3>📝 Заметка к №${n}</h3>
      <div class="muted" style="margin-bottom:8px">${esc(SUBJECTS[subj].tasks[n][0])}</div>
      <textarea id="noteInput" placeholder="Что запомнить...">${esc(cur)}</textarea>
      <div class="modal-actions">
        <button class="btn" data-action="closeModal">Отмена</button>
        <button class="btn primary" data-action="saveNote" data-num="${n}">Сохранить</button>
      </div>`);
    setTimeout(() => document.getElementById("noteInput")?.focus(), 50);
  }
});

document.getElementById("view").addEventListener("change", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  if (a === "sort") { ui.sort = el.value; render(); }
  else if (a === "univSelect") populatePrograms();
});

document.getElementById("view").addEventListener("input", e => {
  const el = e.target.closest('[data-action="search"]');
  if (el) {
    ui.query = el.value.trim().toLowerCase();
    const list = document.getElementById("taskList");
    if (list) {
      const subj = ui.subject;
      const meta = SUBJECTS[subj];
      const st = data.state[subj] || {};
      const rows = [];
      for (const n of Object.keys(meta.tasks).map(Number).sort((a,b)=>a-b)) {
        const s = st[n] || "none";
        if (ui.filter !== "all" && s !== ui.filter) continue;
        const [topic, pts] = meta.tasks[n];
        if (ui.query && !topic.toLowerCase().includes(ui.query)) continue;
        const note = (data.notes[subj] || {})[n] || "";
        const scale = meta.scale[Math.min(pts, meta.maxPrimary)];
        rows.push(`
          <div class="task ${s}" data-num="${n}">
            <div class="num">${n}</div>
            <div class="info" data-action="editNote" data-num="${n}">
              <div class="title">${esc(topic)}${note?" 📝":""}</div>
              <div class="meta">${pts} перв. · ≈${scale} тест.</div>
            </div>
            <div class="actions">
              ${["know","learn","weak"].map(x =>
                `<button data-action="mark" data-num="${n}" data-st="${x}" class="${s===x?"active":""}">${STATUS_META[x].sym}</button>`
              ).join("")}
            </div>
          </div>`);
      }
      list.innerHTML = rows.join("") || '<div class="center">Ничего не найдено</div>';
    }
  }
  const mP = e.target.closest('[data-action="mockPrimary"]');
  if (mP) {
    const subj = document.querySelector('[data-action="mockSubject"]').value;
    const meta = SUBJECTS[subj];
    const p = Math.max(0, Math.min(parseInt(mP.value) || 0, meta.maxPrimary));
    const prev = document.getElementById("mockPreview");
    if (prev) prev.textContent = `→ ${meta.scale[p]} тест. баллов`;
  }
});

// ===================== ТАЙМЕР =====================
const timer = { running:false, remaining:25*60, mode:"focus", subject:"math", elapsed:0, id:null };
document.getElementById("timerBtn").addEventListener("click", () => {
  const subjOpts = Object.entries(SUBJECTS).map(([k, m]) =>
    `<option value="${k}" ${k===timer.subject?"selected":""}>${m.name}</option>`).join("");
  const mins = Math.floor(timer.remaining / 60);
  const secs = timer.remaining % 60;
  openModal(`
    <h3 style="text-align:center">⏱ Помодоро</h3>
    <select id="timerSubject" style="margin-bottom:10px">${subjOpts}</select>
    <div class="timer-time" id="timerTime">${String(mins).padStart(2,"0")}:${String(secs).padStart(2,"0")}</div>
    <div class="timer-modes">
      <button data-action="tmode" data-m="focus" class="${timer.mode==="focus"?"active":""}">🎯 25</button>
      <button data-action="tmode" data-m="short" class="${timer.mode==="short"?"active":""}">☕ 5</button>
      <button data-action="tmode" data-m="long"  class="${timer.mode==="long"?"active":""}">🌴 15</button>
    </div>
    <div class="timer-actions">
      <button class="btn primary" id="timerStart">▶ Старт</button>
      <button class="btn" id="timerStop">■ Стоп</button>
    </div>
    <div class="timer-status" id="timerStatus"></div>
    <div class="modal-actions" style="margin-top:10px">
      <button class="btn" data-action="closeModal">Закрыть</button>
    </div>
  `);
  const renderTime = () => {
    const el = document.getElementById("timerTime"); if (!el) return;
    const r = Math.max(0, timer.remaining);
    const m = Math.floor(r / 60), s = r % 60;
    el.textContent = `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  };
  const start = () => {
    if (timer.running) return;
    timer.running = true;
    const b = document.getElementById("timerStart"); if (b) b.textContent = "⏸ Пауза";
    const s = document.getElementById("timerStatus"); if (s) s.textContent = "Идёт сессия...";
    tick();
  };
  const pause = () => {
    timer.running = false;
    clearTimeout(timer.id);
    const b = document.getElementById("timerStart"); if (b) b.textContent = "▶ Продолжить";
    const s = document.getElementById("timerStatus"); if (s) s.textContent = "Пауза";
  };
  const finish = (auto) => {
    timer.running = false;
    clearTimeout(timer.id);
    if (timer.mode === "focus" && timer.elapsed >= 60) {
      data.studyLog.push({ date: todayStr(), subject: timer.subject, seconds: timer.elapsed, task: null });
      registerStudyDay(); saveData();
      const s = document.getElementById("timerStatus");
      if (s) s.textContent = `✅ Записано: ${fmtDuration(timer.elapsed)}`;
    } else if (auto) {
      const s = document.getElementById("timerStatus"); if (s) s.textContent = "⏰ Время вышло!";
    }
    timer.elapsed = 0;
    timer.remaining = { focus:25*60, short:5*60, long:15*60 }[timer.mode];
    renderTime();
    const b = document.getElementById("timerStart"); if (b) b.textContent = "▶ Старт";
  };
  const tick = () => {
    if (!timer.running) return;
    timer.remaining--;
    timer.elapsed++;
    renderTime();
    if (timer.remaining <= 0) { finish(true); return; }
    timer.id = setTimeout(tick, 1000);
  };
  const startBtn = document.getElementById("timerStart");
  const stopBtn  = document.getElementById("timerStop");
  if (startBtn) startBtn.onclick = () => timer.running ? pause() : start();
  if (stopBtn)  stopBtn.onclick  = () => finish(false);
  document.querySelectorAll('[data-action="tmode"]').forEach(b => {
    b.onclick = () => {
      if (timer.running) return;
      timer.mode = b.dataset.m;
      timer.remaining = { focus:25*60, short:5*60, long:15*60 }[timer.mode];
      timer.elapsed = 0;
      renderTime();
      document.querySelectorAll('[data-action="tmode"]').forEach(x => x.classList.remove("active"));
      b.classList.add("active");
    };
  });
  const subjSel = document.getElementById("timerSubject");
  if (subjSel) subjSel.onchange = () => { timer.subject = subjSel.value; };
});

// ===================== СТАРТ =====================
render();
</script>
</body>
